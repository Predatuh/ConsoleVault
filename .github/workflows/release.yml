name: Build & Release

# Bump the number in VERSION and push to main -> GitHub builds ConsoleVault-Setup.exe
# and publishes it as release vX.Y.Z. Installed copies see it and update themselves.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stamp version and repo into the app
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $src = Get-Content consolevault.py -Raw
          $src = $src.Replace('__VERSION__', $v).Replace('__REPO__', '${{ github.repository }}')
          Set-Content consolevault.py $src -Encoding utf8NoBOM
          "APPVER=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          $exists = if ($LASTEXITCODE -eq 0) { "true" } else { "false" }
          "RELEASE_EXISTS=$exists" | Out-File -FilePath $env:GITHUB_ENV -Append
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install build tools
        run: python -m pip install --upgrade pip pyside6 pyinstaller

      - name: Build app
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name ConsoleVault consolevault.py

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APPVER" installer.iss

      - name: Publish release
        if: env.RELEASE_EXISTS != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APPVER }}
          name: ConsoleVault ${{ env.APPVER }}
          target_commitish: ${{ github.sha }}
          files: Output/ConsoleVault-Setup.exe
          generate_release_notes: true

      - uses: actions/upload-artifact@v4
        with:
          name: ConsoleVault-Setup
          path: Output/ConsoleVault-Setup.exe
